name: Instaladores

# Se ejecuta al publicar una versión (etiqueta v0.1.0, v0.2.0…) o a mano desde la pestaña Actions.
# A mano, si se indica una versión («v0.1.0»), también se crea la Release y su etiqueta.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión que se publica como Release (por ejemplo, v0.1.0). Vacío: solo instaladores.'
        required: false
        default: ''

jobs:
  instalador:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            builder: --win
            unpacked: release/win-unpacked/L10N Suite.exe
          - name: macOS (Apple Silicon)
            os: macos-latest
            builder: --mac
            unpacked: release/mac-arm64/L10N Suite.app/Contents/MacOS/L10N Suite
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas del motor
        run: npm test
      - name: Preparar la app
        run: npm run desktop:stage
      - name: Generar el instalador
        working-directory: apps/desktop
        run: npx electron-builder --config electron-builder.yml ${{ matrix.builder }} --publish never
      - name: Firma ad hoc (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: codesign --verify --deep --strict --verbose=2 "release/mac-arm64/L10N Suite.app" && codesign -dv "release/mac-arm64/L10N Suite.app"
      - name: Autocomprobación de la app empaquetada (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        env:
          L10N_SELFTEST_LOG: ${{ runner.temp }}/autocomprobacion.log
        run: |
          "${{ matrix.unpacked }}" --selftest || { cat "$L10N_SELFTEST_LOG"; exit 1; }
          cat "$L10N_SELFTEST_LOG"
      - name: Autocomprobación de la app empaquetada (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        shell: pwsh
        env:
          L10N_SELFTEST_LOG: ${{ runner.temp }}\autocomprobacion.log
          L10N_DISABLE_GPU: '1'
        run: |
          $p = Start-Process -FilePath "${{ matrix.unpacked }}" -ArgumentList '--selftest' -Wait -PassThru
          if (Test-Path $env:L10N_SELFTEST_LOG) { Get-Content $env:L10N_SELFTEST_LOG }
          if ($p.ExitCode -ne 0) { throw "La autocomprobación ha fallado (código $($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ runner.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 30

  publicar:
    name: Publicar la versión
    needs: instalador
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.version, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true
      - name: Crear la Release con los instaladores
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Versión no válida: ${VERSION}"; exit 1; }
          gh release create "${VERSION}" instaladores/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "L10N Suite ${VERSION}" \
            --notes "Instaladores de L10N Suite ${VERSION}. Consulta docs/MANUAL.md para instalar y abrir la app por primera vez."
